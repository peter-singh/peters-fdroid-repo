Name: Juiced (unofficial)
Summary: Unofficial app for checking and controlling your Nissan EV
Description: |-
  Juiced, formerly NissanConnect: an unofficial app for checking battery status and starting
  climate control on your Nissan EV, with a home-screen widget, Tasker plugin and Wear OS app.
  Not affiliated with or endorsed by Nissan. Sign in with your own account.
